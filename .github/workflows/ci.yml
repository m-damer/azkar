name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: gen-l10n
        run: flutter gen-l10n
      - name: build_runner (only when the project uses it)
        run: |
          if grep -q '^  build_runner:' pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          else
            echo "build_runner not used yet"
          fi
      - name: Analyze (errors, warnings and infos all fail)
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Test (includes design-system tests)
        run: flutter test
      - name: Restore stable debug keystore
        id: key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.jks"
            {
              echo "DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/debug.jks"
              echo "DEBUG_KEYSTORE_PASSWORD=$DEBUG_KEYSTORE_PASSWORD"
              echo "DEBUG_KEY_ALIAS=$DEBUG_KEY_ALIAS"
              echo "DEBUG_KEY_PASSWORD=$DEBUG_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::DEBUG_KEYSTORE_* secrets are missing - this APK uses a throwaway key and will NOT update over the previous one."
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Build debug APK (versionCode = run number)
        # Gradle downloads sometimes hit a transient 504 from GitHub: retry.
        run: |
          for i in 1 2 3; do
            flutter build apk --debug --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }} && exit 0
            echo "build attempt $i failed, retrying"; sleep 20
          done
          exit 1
      - name: Show the signing certificate
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-debug.apk | grep -E "SHA-256|Signer #1 certificate DN"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.key.outputs.stable == 'true' && 'azkar-debug-apk' || 'azkar-debug-apk-UNSTABLE-KEY' }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - name: Publish to the dev release (the in-app updater reads it)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.key.outputs.stable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk azkar-debug.apk
          printf 'build=%s\n%s\n' "${{ github.run_number }}" "$(git log -1 --pretty=%s)" > notes.txt
          if gh release view dev >/dev/null 2>&1; then
            gh release upload dev azkar-debug.apk --clobber
            gh release edit dev --notes-file notes.txt --prerelease
          else
            gh release create dev azkar-debug.apk --prerelease --title "dev build" --notes-file notes.txt --target main
          fi
