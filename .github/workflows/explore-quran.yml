name: Explore Quran sources
on:
  workflow_dispatch:
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch candidates
        run: |
          set +e
          mkdir -p t && cd t
          for u in \
           "https://verses.quran.foundation/fonts/quran/hafs/v2/ttf/QCF_BSML.ttf" \
           "https://verses.quran.foundation/fonts/quran/hafs/v2/woff2/QCF_BSML.woff2" \
           "https://static-cdn.tarteel.ai/qul/fonts/quran_fonts/v2/ttf/QCF_BSML.ttf" \
           "https://static-cdn.tarteel.ai/qul/fonts/quran_fonts/v2/ttf/qcf_bsml.ttf" \
           "https://static-cdn.tarteel.ai/qul/fonts/quran_fonts/v2/ttf/p604.ttf" \
           "https://raw.githubusercontent.com/quranwbw/qpc-fonts/HEAD/mushaf-v2/QCF2604.ttf" \
           "https://raw.githubusercontent.com/quranwbw/qpc-fonts/HEAD/mushaf-v2/QCF_BSML.ttf" \
           "https://raw.githubusercontent.com/quranwbw/qpc-fonts/HEAD/mushaf-woff2/QCF_BSML.woff2" \
           "https://raw.githubusercontent.com/quranwbw/qpc-fonts/HEAD/various/UthmanicHafs1%20Ver18.ttf"; do
            f=$(basename "$u" | sed 's/%20/_/g'); curl -sS -m 60 -L -o "$f" -w "HTTP %{http_code} %{size_download} $u\n" "$u"; done
          curl -sS "https://api.github.com/repos/quranwbw/qpc-fonts/git/trees/HEAD?recursive=1" | python3 -c "
          import sys,json
          for x in json.load(sys.stdin)['tree']:
            p=x['path']
            if 'BSML' in p or p.startswith('various'): print(p,x.get('size'))"
          ls -la
      - name: Inspect and render
        run: |
          pip install -q fonttools pillow brotli
          cd t
          python3 - <<'P'
          import glob
          from fontTools.ttLib import TTFont
          for f in sorted(glob.glob('*')):
            try:
              t=TTFont(f); cm=t.getBestCmap()
              print(f,len(cm),[hex(k) for k in list(cm)[:12]])
            except Exception as e: pass
          P
          python3 - <<'P'
          from PIL import Image,ImageDraw,ImageFont
          import glob
          im=Image.new('RGB',(1400,700),'white'); d=ImageDraw.Draw(im)
          y=10
          f=ImageFont.truetype('p604.ttf',90)
          d.text((20,y),'ﱁ ﱂ ﱃ ﱄ ﱅ',font=f,fill='black'); y+=140
          for fn in glob.glob('*BSML*.ttf'):
            from fontTools.ttLib import TTFont
            cm=TTFont(fn).getBestCmap()
            s=''.join(chr(k) for k in list(cm)[:6])
            fb=ImageFont.truetype(fn,110); d.text((20,y),s,font=fb,fill='black'); y+=200
          im.save('sample.png')
          P
      - uses: actions/upload-artifact@v4
        with:
          name: sample
          path: t/sample.png
