name: Build signed APK
# Manual only: run it when Mahmoud says "build".
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Test
        run: flutter test
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::signing key secrets are missing"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "DEBUG_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "DEBUG_KEY_ALIAS=$KEY_ALIAS"
            echo "DEBUG_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build release APK (versionCode = run number)
        run: |
          for i in 1 2 3; do
            flutter build apk --release --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }} --dart-define=UPDATE_TAG=release && exit 0
            echo "build attempt $i failed, retrying"; sleep 20
          done
          exit 1
      - name: Verify the signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -E "SHA-256|Signer #1 certificate DN"
      - uses: actions/upload-artifact@v4
        with:
          name: azkar-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Publish to the release tag (the in-app updater reads it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk azkar.apk
          printf 'build=%s\n%s\n' "${{ github.run_number }}" "$(git log -1 --pretty=%s)" > notes.txt
          if gh release view release >/dev/null 2>&1; then
            gh release upload release azkar.apk --clobber
            gh release edit release --notes-file notes.txt
          else
            gh release create release azkar.apk --title "أذكار" --notes-file notes.txt --target main
          fi
